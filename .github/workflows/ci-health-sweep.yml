# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Owner: Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>
# CI-Health Sweep — estate-wide detection + auto-remediation of the
# infrastructure CI failure classes diagnosed 2026-06-13 (see
# scripts/ci-health/README.adoc):
#   A-BILLING     account spending-limit/payment wall   -> REPORT (owner-only)
#   B-ALLOWLIST   selected + incomplete canonical patterns -> AUTO-FIX (allow-list)
#   B-LOCKFILE    startup_failure attributable to lock/YAML drift -> DRY B-LOCKFIX
#   B-BADPIN      startup_failure attributable to an unresolvable ref -> REPORT
#   B-OFFBRANCH   startup_failure from a cross-repo reusable pin that is not an
#                 ancestor of the callee's default branch (or does not resolve) -> REPORT
#   B-PERMS       startup_failure from a caller under-granting permissions the
#                 called reusable requires (standards#451) -> REPORT
#   B-ACTOR       startup_failure from a refused triggering actor          -> REPORT
#   B-STARTUPFAIL observed startup_failure runs with no attributable cause -> REPORT
#   D-BURN        bare [push, pull_request] double-trigger-> AUTO-FIX (PR)
#
# Complements metadatastician-remediation-sweep.yml (Dependabot) — same fleet-sweep
# shape, staggered cron to avoid token-rate-limit collisions.
name: CI-Health Sweep

on:
  schedule:
    - cron: '47 4 * * *'   # daily 04:47 UTC (staggered off hyperpolymath sweep at 03:47)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect + report only (no allow-list PUTs, no PRs)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      enable_lockfix_prs:
        description: 'EXPLICIT owner opt-in: permit lock-only cross-repo PRs (never enabled on schedule)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      limit:
        description: 'Small test sweep: maximum number of repositories (0 = all)'
        required: false
        default: '0'
        type: string
      owner:
        description: 'Owner to sweep'
        required: false
        default: 'metadatastician'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Detect + remediate estate CI health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ── Why this is a readable tag and not a SHA ─────────────────────────
      # GitHub Actions resolves a workflow's `uses:` refs THROUGH
      # .github/workflows/actions.lock. A ref the lock does not record *under
      # this workflow's own path* makes GitHub refuse the run at creation:
      # `startup_failure`, zero jobs, no log, nothing in REST or GraphQL.
      #
      # PR #40, merged 2026-09-23T11:10Z, changed this line from `@v7.0.1` to
      # `@3d3c42e5aac5ba805825da76410c181273ba90b1` — the very commit the lock
      # already resolved that tag to — without regenerating the lock. Every run
      # from 2026-09-24 was refused (35957324128, 36096095736, 36218967182,
      # 36295476367), so issue #30 kept showing a stale report that looked live.
      #
      # `actions.lock` records this ref's immutable commit
      # (commit: 'sha1-3d3c42e5aac5ba805825da76410c181273ba90b1'), and the lock
      # is what actually runs. So the tag is not a weaker pin here — the
      # immutability lives in the lock, and the readable ref keeps the workflow
      # reviewable. This is the shape the estate documents in
      # hyperpolymath/seamstress#75. Restoring it is the smallest change that
      # puts the ref and the lock back into agreement.
      #
      # Re-arm trigger: when a working `gh actions-lock` can regenerate the lock
      # here (see the lock-sync gate's notes), re-pin to the SHA and regenerate.
      - uses: actions/checkout@v7.0.1
      - name: Run CI-health sweep
        env:
          # PAT needs classic `repo` + `workflow` + `admin:org` scopes:
          # organization Actions-policy write, D-BURN PR creation, and issue
          # upsert. A repo-only token cannot change the inherited allow-list.
          GH_TOKEN: ${{ secrets.METADATASTICIAN_DISPATCH_PAT }}
          OWNER: ${{ inputs.owner || 'metadatastician' }}
          # Scheduled runs remediate live (owner opted into auto-remediation);
          # manual dispatch defaults to dry-run for safety.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          MAX_BURN_PRS: '15'
          MAX_LOCKFIX_PRS: '15'
          LIMIT: ${{ inputs.limit || '0' }}
          ENABLE_LOCKFIX_PRS: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_lockfix_prs || 'false' }}
          ISSUE_REPO: metadatastician-governance
          CI_HEALTH_DENYLIST: ''   # No denylist for metadatastician estate
        run: |
          chmod +x scripts/ci-health/*.sh
          gh extension install github/gh-actions-lock --pin v0.1.6
          ./scripts/ci-health/sweep.sh
