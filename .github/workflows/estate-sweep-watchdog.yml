#
# Estate Sweep Watchdog — monitors the monitors.
#
# Why this exists: the CI-Health Sweep is the estate's only detector for the
# infrastructure failure classes, and PR #40 (merged 2026-09-23T11:10Z) pinned
# its checkout ref to a SHA while actions.lock still recorded the tag. From the
# next scheduled run on 2026-09-24 GitHub refused it at startup — zero jobs, no
# log — so the sweep stopped running AND stopped reporting that it had stopped.
# The rolling CI-health issue (#30) kept showing the 2026-09-20 report and
# looked current. A monitor that can be switched off by the class it monitors is
# not a monitor.
#
# So this workflow watches the sweep's own run history, opens a separate rolling
# issue when the sweep's last SUCCESS is older than the freshness horizon or its
# latest run failed to start, and — a promise the first version made in its own
# issue text without any code to keep it — closes that issue when the sweep is
# fresh and successful again.
#
# It deliberately carries NO `uses:` of its own (no actions/checkout, no
# third-party action), because that is the only shape that cannot be taken out
# by a lockfile problem. Do not add a `uses:` to this file.
#
# ── What its first run taught us (2026-09-28) ────────────────────────────────
# It fired correctly and then misdescribed what it had found. The sweep's lock
# repair from PR #42 worked: the run started, checked out through the lock, and
# ran for 17m54s before failing inside the sweep script. This watchdog had
# measured `failure`, not `startup_failure` — it fired on the age of the last
# success — yet it titled the issue "sweep is not running" and explained the two
# causes of `startup_failure`. A reader would have gone hunting for a lockfile
# fault that no longer existed, which is the same misdirection that made the
# original outage take four days to diagnose. The wording is now derived from
# the measurements and the guidance branches on them.
#
# ── What its second week taught us (2026-09-29) ──────────────────────────────
# The sweep then failed for eight days for a reason the guidance never named:
# one empty repository (`gh: Git Repository is empty. (HTTP 409)`), which
# detect.sh treated as an instrument failure. The checklist below had sent two
# diagnoses after the token scope instead. The evidence was in the job log the
# whole time, but a job log is a redirect to blob storage that many readers of
# this issue cannot fetch, and it did not even name the repository. So the
# sweep now states its refusal as check-run ANNOTATIONS (plain REST), and this
# workflow quotes them in the issue: the run's own words outrank a checklist.
name: Estate Sweep Watchdog

on:
  schedule:
    - cron: "17 7 * * *"   # daily 07:17 UTC — after the 04:47 sweep has had time to run
  workflow_dispatch:

permissions:
  actions: read
  checks: read       # check-run annotations: what a failed run said about itself
  contents: read
  issues: write

concurrency:
  group: estate-sweep-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    # Named for what it examines, not for a conclusion it has not reached yet.
    # "CI-Health Sweep is running" asserted an answer in the check list even on
    # the runs where the answer was that it was not.
    name: Sweep freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the sweep's run history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="🩺 CI-Health: estate report is stale"
          # The title doubles as the search key for the rolling issue, so the
          # previous wording is still searched for and any issue found under it
          # is renamed. Otherwise changing the title orphans the existing issue
          # and opens a duplicate on every run.
          LEGACY_TITLE="🩺 CI-Health: sweep is not running"
          STALE_HOURS=26          # daily schedule + slack for queueing
          run_json=$(gh api "repos/${REPO}/actions/workflows/ci-health-sweep.yml/runs?per_page=20")
          last_ok=$(printf '%s' "$run_json" | jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].created_at // ""')
          last_any=$(printf '%s' "$run_json" | jq -r '[.workflow_runs[]][0] | [.conclusion, .created_at, .id] | @tsv')
          printf 'last successful sweep: %s\nlatest run: %s\n' "${last_ok:-none}" "$last_any"

          stale=false
          cutoff=$(date -u -d "${STALE_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)
          if [ -z "$last_ok" ]; then
            stale=true
          else
            [ "$last_ok" \< "$cutoff" ] && stale=true
          fi
          latest_conclusion=$(printf '%s' "$last_any" | cut -f1)
          if [ "$latest_conclusion" = "startup_failure" ]; then stale=true; fi

          # Resolve the rolling issue once, under either wording, so the healthy
          # path and the stale path act on the same issue.
          num=$(gh issue list --repo "$REPO" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            num=$(gh issue list --repo "$REPO" --state open --search "$LEGACY_TITLE in:title" --json number --jq '.[0].number // empty')
          fi

          # ── Healthy: actually close it ─────────────────────────────────────
          # Closing needs BOTH a fresh success AND the newest run to be that
          # success. A fresh success with a newer failure on top of it means the
          # published report is already one run behind, which is worth saying
          # but not worth escalating or closing over.
          if [ "$stale" = false ] && [ "$latest_conclusion" = "success" ]; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --repo "$REPO" --body "Closing automatically: the newest CI-Health Sweep run succeeded (\`${last_ok}\`), inside the ${STALE_HOURS}h freshness horizon, so the rolling estate report is current." >/dev/null
              gh issue close "$num" --repo "$REPO" --reason completed >/dev/null
              echo "closed watchdog issue #$num — the sweep is healthy and the report is fresh"
            else
              echo "sweep is healthy; nothing to report"
            fi
            exit 0
          fi

          if [ "$stale" = false ]; then
            echo "a success is fresh (${last_ok}) but the newest run concluded '${latest_conclusion}'; the published report is one run behind — neither escalating nor closing"
            exit 0
          fi

          latest_id=$(printf '%s' "$last_any" | cut -f3)
          latest_created=$(printf '%s' "$last_any" | cut -f2)

          # Name the observed state and nothing else.
          case "$latest_conclusion" in
            startup_failure)
              observed="**did not start** (\`startup_failure\`): zero jobs were created, so there is no log and no check conclusion"
              ;;
            success)
              observed="succeeded, but that success is older than the ${STALE_HOURS}h freshness horizon, so no run since has refreshed the report"
              ;;
            none|null|"")
              observed="has **no run history at all**"
              ;;
            *)
              observed="**started and then failed** (\`${latest_conclusion}\`). Starting is not passing, and a run that started is not a lockfile or an actor problem"
              ;;
          esac

          # ── What the failing run itself reported ───────────────────────────
          # A failed job's LOG is a redirect to blob storage that many readers of
          # this issue cannot fetch, which is why diagnoses of this sweep were
          # reasoned from run durations. Its ANNOTATIONS are plain REST, and
          # sweep.sh states its refusal there: which target failed and why. Quote
          # them instead of sending the reader to guess from a checklist. Best
          # effort by construction: nothing here may stop the issue being opened,
          # which is this workflow's whole job.
          run_evidence() {
            local rid=$1 job_ids job
            job_ids=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="cancelled") | .id') || return 1
            for job in $job_ids; do
              gh api "repos/${REPO}/check-runs/${job}/annotations?per_page=100" \
                --jq '.[] | select(.annotation_level=="failure" or .annotation_level=="warning") | "\(.annotation_level): \(if (.title // "") == "" then "" else .title + " — " end)\(.message)"' || return 1
            done
          }
          evidence_block=""
          case "$latest_conclusion" in
            startup_failure | success | none | null | "") ;;
            *)
              if evidence=$(run_evidence "$latest_id" 2>/dev/null); then
                # Quoted, not interpreted: bounded, and unable to close its own fence.
                evidence=$(printf '%s\n' "$evidence" | tr -d '\r`' | sed 's/~~~/---/g' | cut -c1-600 | head -n 30 || true)
                if [ -n "$evidence" ]; then
                  evidence_block=$(printf '%s\n\n~~~text\n%s\n~~~' \
                    "**What that run reported about itself** — its own check-run annotations, which the API serves even when the job log is out of reach. Where they name a cause, they outrank the checklist below:" \
                    "$evidence")
                else
                  evidence_block="**What that run reported about itself:** no failure annotation was recorded beyond its exit status."
                fi
              else
                evidence_block="**What that run reported about itself:** its annotations could not be read from here (that needs \`checks: read\`); read the run page instead."
              fi
              ;;
          esac

          # Guidance follows the observation, so nobody is sent down the branch
          # that does not apply to what actually happened.
          if [ "$latest_conclusion" = "startup_failure" ]; then
            guidance=$(cat <<'GUIDE'
          A run that never started has exactly two causes, and they need opposite
          responses. Both are visible only in the run-page annotation — REST and
          GraphQL never carry the reason.

          1. **An invalid lockfile.** The annotation reads "Invalid lockfile …
          The lockfile could not be validated. Regenerate it by running `gh actions-lock`".
          Check with `scripts/check-lock-sync.sh` and `scripts/check-lock-pins.sh`;
          see `.github/workflows/lock-sync-gate.yml`.

          2. **An actor GitHub refuses.** The annotation reads "Actor is not allowed to
          trigger Actions workflows". This is decided *before any workflow file is read*,
          so no repository change fixes it — the org or repository Actions policy must
          permit the triggering app. It affects even workflows with no `uses:` and
          repositories with no lockfile, which is how it was mistaken for lock drift.

          `scripts/ci-health/detect.sh` separates them (`B-LOCKFILE` / `B-BADPIN`
          versus `B-ACTOR`). If the newest failing run was triggered by an app, read
          the run page annotation before changing any file.
          GUIDE
          )
          else
            guidance=$(cat <<'GUIDE'
          The run started, so the lockfile and the actor allow-list are both fine and
          neither is worth investigating. The discriminator is cheap: compare the
          job's `started_at` and `completed_at`. Minutes of runtime means the script
          ran and failed on purpose or on a real error; seconds means it died at its
          first command, which for this sweep is almost always its token.

          For this sweep, check in this order:

          1. **The honest-refusal guard.** `scripts/ci-health/sweep.sh` exits 2 with
          "Detection was incomplete for N repo(s); refusing remediation and a false
          health report" when any `detect.sh` call fails, and it names each failed
          target and why in its annotations (quoted above when they could be read).
          That is the design working, not a bug: it will not publish a health report
          it could not fully compute, and it exits *before* the tracking-issue upsert
          — which is why the report issue goes stale instead of showing partial data.
          2. **Token scope.** `detect.sh @organization` reads the org Actions policy
          and emits `E-INSTRUMENT` (exit 2) on a 403. The sweep's PAT needs classic
          `repo` + `workflow` + `admin:org`, as `.github/workflows/ci-health-sweep.yml`
          documents; a repo-only token guarantees this failure on every run.
          3. **The job log**, if it is reachable from where you are reading this.
          GUIDE
          )
          fi

          body=$(cat <<EOF
          ## 🩺 CI-Health: the estate report is stale

          _Checked $(date -u +%Y-%m-%dT%H:%MZ) · last successful sweep: \`${last_ok:-never}\` · freshness horizon ${STALE_HOURS}h_

          The rolling CI-health report is only as fresh as the sweep's last
          successful run. A run that fails at *startup* creates zero jobs, writes no
          log, and looks like a check that simply never ran — which is how the
          2026-09-20 report stayed on issue #30 while the sweep was dead from
          2026-09-24 to 2026-09-27.

          **Measured now.** Latest run:
          [\`${latest_id}\`](https://github.com/${REPO}/actions/runs/${latest_id}),
          created ${latest_created:-unknown}, conclusion
          \`${latest_conclusion:-none}\` — it ${observed}.

          ${evidence_block}

          ${guidance}

          This issue is closed automatically by this watchdog on the first run that
          is both fresh and successful.
          EOF
          )

          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$REPO" --title "$TITLE" >/dev/null
            gh issue comment "$num" --repo "$REPO" --body "$body" >/dev/null
            echo "updated watchdog issue #$num (title converged on the measured state)"
          else
            gh issue create --repo "$REPO" --title "$TITLE" --body "$body" >/dev/null
            echo "opened watchdog issue"
          fi
