#
# zz-probe-actions-lock — TEMPORARY, READ-ONLY PROBE. Delete once answered.
#
# ── The single question this answers ───────────────────────────────────────
#
#   Can `gh actions-lock` be obtained and run on a GitHub runner?
#
# It cannot be answered from the authoring environment. Measured there on
# 2026-09-28 (raw output recorded in docs/governance/CI-CD-COVERAGE.adoc):
#
#   $ gh extension install github/gh-actions-lock
#   failed to download asset linux-amd64: Get
#   "https://release-assets.githubusercontent.com/github-production-release-asset/…": EOF
#   $ gh actions-lock --version
#   failed to run extension: fork/exec …/gh-actions-lock: no such file or directory
#
# The extension's release metadata is readable through the API (v0.1.6, asset
# `linux-amd64`, 11268280 bytes, published 2026-07-28) and its source tree
# clones fine — only the release-asset CDN host is unreachable. So the missing
# piece is a network egress restriction of the sandbox, not a missing tool.
# Whether the *runner* can fetch it is a fact about the runner, and the only
# way to know is to ask a runner.
#
# Why that matters: regenerating .github/workflows/actions.lock is the re-arm
# trigger for three deferred items (full-SHA re-pinning of every workflow, the
# four unlisted-workflow coverage gap, and the governance.yml/hypatia-scan.yml
# catalogue callers). A hand-built lock has already been rejected by GitHub
# wholesale, so nothing here writes to the lock until this probe answers.
#
# And the probe deliberately stops at a THROWAWAY COPY for the write-mode
# experiment, because fix mode is documented to rewrite workflows, not just the
# lock: measured in metadatastician/burble#224, it appended duplicate management
# banners to 27 files and de-pinned two bare SHAs back to mutable tags
# (dtolnay/rust-toolchain@02cb101e… -> @v1). Regenerating here must take the
# lockfile only and prove no pin moved.
#
# ── What it does NOT do ────────────────────────────────────────────────────
#
# It writes nothing to the repository. The write-mode experiment runs in a
# throwaway copy under /tmp, and the real lock is checksummed before and after
# with `git status --porcelain` as the backstop, so "read-only" is demonstrated
# rather than asserted.
#
# ── DELIBERATELY CARRIES NO `uses:` AT ALL ─────────────────────────────────
#
# A probe that needs the lockfile mechanism to prove the lockfile mechanism
# works is not a probe. Checkout is a `git` call in a `run:` step, exactly as
# in ci.yml, lock-sync-gate.yml, labels.yml, label-triage.yml and
# estate-sweep-watchdog.yml. Do not add a `uses:` to this file.
#
# ── How to obtain the answer ───────────────────────────────────────────────
#
# Runs triggered by the coding-agent app are refused before any workflow file
# is read ("Actor is not allowed to trigger Actions workflows"), so this probe
# produces `startup_failure` when an agent pushes it. Two ways to get a real
# answer, both owner-side:
#
#   1. Re-run the refused run from the UI (Actions → the run → "Re-run all
#      jobs"). A re-run executes as the person who clicked it, using the
#      workflow file from that run's commit, so it works even after this file
#      has been deleted from the branch.
#   2. Once this file is on the default branch, Actions → "zz-probe-actions-
#      lock" → "Run workflow" (workflow_dispatch).
#
# Then paste the job log into the issue that is tracking the lock blocker and
# delete this file.
name: zz-probe-actions-lock

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Not a gate: nothing may depend on it, and it must never become a required
# check. It is a question, asked once.
concurrency:
  group: zz-probe-actions-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Can a runner obtain gh actions-lock?
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `github.sha` only — the merge commit on a pull_request event. No
          # head-sha and no refs/pull fallback: fetching a contributor-
          # controlled ref into a workflow that then executes code is the
          # cache-poisoning shape CodeQL flags.
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
          echo "checked out $(git rev-parse --short HEAD)"

      - name: Runner facts
        run: |
          set -uo pipefail
          echo "--- gh (preinstalled on the runner image?) ---"
          command -v gh && gh --version
          echo "--- image ---"
          uname -srm
          head -2 /etc/os-release 2>/dev/null
          echo "--- is the release-asset CDN reachable from here? ---"
          # The authoring sandbox gets a TLS/EOF failure on this host. A runner
          # should get an HTTP answer, which is the whole difference.
          curl -sS -o /dev/null -w 'release-assets.githubusercontent.com -> HTTP %{http_code}\n' \
            --max-time 30 https://release-assets.githubusercontent.com/ 2>&1 || echo "curl to the asset host FAILED"
          echo "--- release metadata via the API ---"
          gh api repos/github/gh-actions-lock/releases/latest \
            --jq '{tag:.tag_name,published:.published_at,linux_amd64_bytes:(.assets[]|select(.name=="linux-amd64")|.size)}' 2>&1 || true

      - name: Install the extension
        run: |
          set -uo pipefail
          echo '$ gh extension install github/gh-actions-lock'
          gh extension install github/gh-actions-lock 2>&1
          echo "install exit=$?"
          echo
          echo '$ gh extension list'
          gh extension list 2>&1
          echo
          echo '$ ls -l the installed extension directory'
          ls -l "${HOME}/.local/share/gh/extensions/gh-actions-lock" 2>&1 || true

      - name: Version and flag surface (as installed)
        run: |
          set -uo pipefail
          # The extension's cobra command sets no Version field (checked in its
          # source at cmd/gh-actions-lock/root.go), so `--version` is expected
          # to be an unknown flag. The installed version comes from
          # `gh extension list` and from the release tag; the flag surface comes
          # from --help. Both are printed raw rather than summarised.
          echo '$ gh actions-lock --version'
          gh actions-lock --version 2>&1
          echo "exit=$?"
          echo
          echo '$ gh actions-lock --help'
          gh actions-lock --help 2>&1
          echo "exit=$?"

      - name: Verify the committed lock (READ-ONLY, --verify == --rescan --no-fix)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          before=$(sha256sum .github/workflows/actions.lock)
          echo "lock before: $before"
          echo
          echo '$ gh actions-lock --verify --no-onboard --no-interactive'
          gh actions-lock --verify --no-onboard --no-interactive 2>&1
          echo "verify exit=$?   (0 clean / 1 blocking findings / 2 tool failure)"
          echo
          echo '$ gh actions-lock --no-fix --json=valid,findings,workflows,dependencies'
          gh actions-lock --no-fix --no-onboard --no-interactive \
            --json=valid,findings,workflows,dependencies 2>/dev/null
          echo "json exit=$?"
          echo
          after=$(sha256sum .github/workflows/actions.lock)
          echo "lock after:  $after"
          [ "$before" = "$after" ] && echo "PROOF: the lock is byte-identical — the verify run wrote nothing" \
                                   || echo "PROOF FAILED: the lock changed during a --verify run"
          echo 'git status --porcelain (must be empty):'
          git status --porcelain

      - name: What a regeneration WOULD produce (throwaway copy, nothing committed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # This is the evidence the three deferred items need: does a real
          # regeneration produce a lock that covers every workflow (the five
          # unlisted ones), and does it accept the refs as they stand? It runs
          # in a COPY, so the repository's lock is untouched and no commit is
          # made. Do not "helpfully" copy the result over the real lock — the
          # decision to regenerate is a separate, recorded step.
          real="$PWD"
          real_before=$(sha256sum "$real/.github/workflows/actions.lock")
          echo "the repository's lock before: $real_before"
          work=$(mktemp -d)
          cp -a . "$work/repo"
          cd "$work/repo"
          before=$(sha256sum .github/workflows/actions.lock)
          echo "copy's lock before: $before"
          echo
          echo '$ gh actions-lock --no-migrate-local-actions --no-interactive   (in the copy)'
          gh actions-lock --no-migrate-local-actions --no-interactive 2>&1
          echo "regenerate exit=$?"
          echo
          echo '--- diff the regeneration would produce ---'
          git --no-pager diff --stat
          git --no-pager diff -- .github/workflows/actions.lock
          echo
          echo '--- would every workflow then be listed? ---'
          git --no-pager diff --name-only
          echo
          echo '--- and does the regenerated lock still verify? ---'
          gh actions-lock --verify --no-onboard --no-interactive 2>&1
          echo "re-verify exit=$?"
          cd "$real"
          rm -rf "$work"
          echo "throwaway copy removed; the repository tree was never written to"
          real_after=$(sha256sum "$real/.github/workflows/actions.lock")
          echo "the repository's lock after:  $real_after"
          if [ "${real_before%% *}" = "${real_after%% *}" ]; then
            echo "PROOF: the repository's own lock is byte-identical — the regeneration happened only in the copy"
          else
            echo "PROOF FAILED: the repository's own lock changed"
          fi
          echo 'git status --porcelain in the real checkout (must be empty):'
          git status --porcelain
