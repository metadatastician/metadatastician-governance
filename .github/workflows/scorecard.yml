# SPDX-License-Identifier: MPL-2.0
name: Scorecard

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    # Pinned to the upstream commit this repository declares adopted in
    # docs/governance/ADOPTION-AND-DEVIATIONS.adoc (`2ccc38ea…`), which is an
    # ancestor of hyperpolymath/standards' default branch.
    #
    # Why this line changed: the previous pin, `892497fe…`, is NOT an ancestor of
    # upstream main — `GET /repos/hyperpolymath/standards/compare/892497fe…main`
    # answers `status=diverged`, 416 ahead / 6 behind, i.e. six commits on the
    # pinned line never landed. The run this produced on main (36361142305,
    # 2026-09-28 00:09) failed with ZERO jobs, no annotation on the run page and
    # nothing retrievable in REST. The contrast is measured, not inferred:
    # `secret-scanner.yml` calls the same repository at `092dedad…`, which IS an
    # ancestor of main (`status=ahead`, 0 behind), and its run 36361142459 in the
    # same push succeeded.
    #
    # CONFIRMED, 2026-09-28T08:33Z, by the next run of this workflow on main.
    # Run 36398032843 (push of the merge commit 3eb6625d91) created ONE job —
    # where 36361142305 had created zero — and every step succeeded:
    # `Pull ghcr.io/ossf/scorecard-action:v2.4.3`, `Checkout code`, `Run
    # Scorecard Analysis`, `Upload results artifact`. The pulled action version is
    # itself the evidence that the new callee ran: v2.4.3 is what
    # scorecard-reusable.yml pins at 2ccc38ea…, where the old pin 892497fe… pinned
    # v2.4.4. So the re-point changed the executed callee, and the zero-job
    # failure went away with it.
    #
    # What was honestly unknown when this line was written, and what closed it:
    # the callee existed at both pins, its permissions were a subset of the
    # caller's grant at both, and its own pins resolved at both — so "the pin is
    # off the default branch" was a leading hypothesis, not an established cause,
    # because the job log could not be downloaded from the authoring environment.
    # The falsification criterion was recorded rather than left implicit: if the
    # next run still failed with zero jobs, branch membership was not the cause
    # and this comment had to be corrected. It did not fail, so the criterion is
    # discharged in favour of the hypothesis. One caveat survives the
    # confirmation and should not be lost: this is a single before/after pair with
    # one variable changed, which is good evidence and not a proof of mechanism —
    # GitHub's actual rule for resolving cross-repo reusable calls at a commit
    # that is not an ancestor of the callee's default branch is still undocumented
    # as far as this repository can tell.
    #
    # Permission subset check, measured at the new pin so this re-point cannot
    # introduce the failure class of hyperpolymath/standards#451 (a called
    # workflow may never request more than its caller grants; the symptom is
    # zero jobs at startup). scorecard-reusable.yml at 2ccc38ea… requests
    # workflow-level `contents: read` and job-level `security-events: write` +
    # `id-token: write`. This caller grants all three, plus `actions: read`,
    # which the callee does not request. The grant is therefore a strict
    # superset and is left wider than needed on purpose: it must also cover the
    # callee at any pin the adopted-pin decision moves to, and a grant that is
    # one permission short kills the run silently while an unused permission
    # merely wastes scope.
    #
    # Re-arm trigger: when the adopted upstream pin in
    # ADOPTION-AND-DEVIATIONS.adoc is moved (an owner decision under
    # docs/governance/CHANGE-PROCEDURE.adoc), move this ref with it so the
    # callers and the declared pin stay one fact.
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@2ccc38eaaf8787034ed099e0b72c9ca8b85dc563
