# SPDX-License-Identifier: MPL-2.0
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Run the published CLI container explicitly (the image sets a
      # non-root USER, which GitHub `container:` jobs do not tolerate).
      # Failures propagate — no `|| echo` masking; advisor-mode reporting
      # comes from .oikos.yml (enforcement: warning), not from swallowing
      # exit codes. The former ghcr.io/hyperpolymath/oikos:v2.0.0 pin
      # referenced a tag that never existed on the package.
      - name: Run OikosBot analysis
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/hyperpolymath/oikos:latest \
            report /work \
            --format sarif \
            --output /work/results.sarif \
            --config /work/.oikos.yml \
            --eco-threshold 50

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@39a73d65469e0144129775918a2032174234c279 # v3
        with:
          sarif_file: results.sarif
          category: oikosbot
