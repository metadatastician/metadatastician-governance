# SPDX-License-Identifier: MPL-2.0
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Run the published CLI container explicitly (the image sets a
      # non-root USER, which GitHub `container:` jobs do not tolerate).
      # Failures propagate — no `|| echo` masking; advisor-mode reporting
      # comes from .oikos.yml (enforcement: warning), not from swallowing
      # exit codes. The former ghcr.io/hyperpolymath/oikos:v2.0.0 pin
      # referenced a tag that never existed on the package.
      #
      # The package publishes no version tag: upstream (hyperpolymath/oikosbot)
      # pushes `latest` plus `sha-<commit>` tags from its CI. What its public
      # package page does publish is DIGESTS, so the pin here is by digest and
      # the provenance is recorded rather than guessed: this digest is what
      # tag `latest` resolved to when this line was written — read off
      # hyperpolymath/oikosbot → Packages → oikos on 2026-09-29 (`latest`
      # shared with `sha-2f47a61`, digest shown below). This closes deviation
      # D-C's form; the deviation's review triggers are unchanged.
      - name: Run OikosBot analysis
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            ghcr.io/hyperpolymath/oikos@sha256:cc9b731d8df9fde0fbde4e404b9cd27ad063760d16418e5cd12fa1187cbb1ded \
            report /work \
            --format sarif \
            --output /work/results.sarif \
            --config /work/.oikos.yml \
            --eco-threshold 50

      # Print the digest docker actually resolved, so a job log shows the exact
      # bytes that ran (a digest reference cannot drift, but the record makes
      # the pull auditable when the log is next readable).
      - name: Record the resolved image digest
        run: |
          docker image inspect \
            ghcr.io/hyperpolymath/oikos@sha256:cc9b731d8df9fde0fbde4e404b9cd27ad063760d16418e5cd12fa1187cbb1ded \
            --format 'resolved RepoDigests: {{json .RepoDigests}}'

      - name: Upload SARIF to GitHub Security
        if: always()
        # Same pin and the same estate-provenance comment shape the retired
        # codeql.yml carried: this line previously read
        # `@1c5b6756… # v4.38.0 (4.38.1 blocked estate-wide; nexia-list#100)`
        # while `1c5b6756…` IS v4.38.1. Now v4.38.0 (b96794f0…).
        #
        # SCOPE, stated narrowly so it is not over-read: this pin governs the
        # UPLOAD step only. The reason this workflow is red is upstream of it —
        # `Run OikosBot analysis` fails, so no results.sarif is ever written and
        # this upload then fails for want of its input (run 36398030720). A
        # correct pin cannot fix a missing file. The analysis step's own cause
        # is NOT established; see docs/governance/CI-CD-COVERAGE.adoc, which
        # records it as undiagnosed, and D-C in ADOPTION-AND-DEVIATIONS.adoc
        # (image now pinned by digest with recorded provenance; the digest pins
        # the analysis image, not this upload action).
        # The comment above says v4.38.0 while the pin below previously read
        # `2892aa5e19bb…`, which is v4.38.2 (verified 2026-09-29 against the
        # annotated tag objects: v4.38.0 → b96794f015dfd88f…, v4.38.1 →
        # 1c5b6756…, v4.38.2 → 2892aa5e19bb…). The estate-approved version for
        # codeql-action is v4.38.0 (nexia-list#100); re-point the SHA at the
        # commit the comment has always claimed.
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0 (nexia-list#100)
        with:
          sarif_file: results.sarif
          category: oikosbot
