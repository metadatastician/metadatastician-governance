# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
#
# Deliberately NO `secrets:` line. The callee at the pinned SHA declares no
# `workflow_call.secrets` and references no `secrets.*` context (gitleaks runs
# as a pinned local binary; the job token is governed by `permissions:`), so
# `secrets: inherit` would forward every caller-visible secret and buy
# nothing (CWE-250). Do not re-add it. (standards#1108 §6b)
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
