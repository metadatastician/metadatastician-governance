#
# Lock Sync Gate — the preventive half of the CI-health B-LOCKFILE class.
#
# Fails any pull request whose .github/workflows/actions.lock has drifted from
# the workflow YAML, or that records a pin which does not resolve. That drift is
# not cosmetic: GitHub refuses such a run at creation, with ZERO jobs, and
# reports only "This run likely failed because of a workflow file issue". On
# 2026-09-24 that killed this repository's own daily CI-Health Sweep for four
# days; on 2026-09-21 a single grouped Dependabot bump (#222) took out eight of
# hyperpolymath/burble's workflows the same way, because Dependabot rewrites
# `uses:` refs in the YAML and cannot touch the lockfile.
#
# This workflow deliberately carries NO `uses:` of its own. It checks out by
# calling git in a `run:` step instead of using actions/checkout, so it has no
# lockfile entry that can go stale and is structurally immune to the failure it
# detects. Do not add a `uses:` to this file — the same rule governs labels.yml
# and label-triage.yml in this repository.
#
# There is also no `paths:` filter, on purpose: a filtered workflow never reports
# on pull requests that miss the filter, which deadlocks any branch ruleset that
# requires this check.
name: Lock Sync Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-sync-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    name: actions.lock is in sync with the workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
          echo "checked out ${SHA}"

      - name: Verify lockfile synchronisation (both directions)
        run: |
          set -euo pipefail
          test -x scripts/check-lock-sync.sh \
            || { echo "::error::scripts/check-lock-sync.sh missing or not executable"; exit 1; }
          ./scripts/check-lock-sync.sh

      - name: Verify every recorded pin resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -x scripts/check-lock-pins.sh \
            || { echo "::error::scripts/check-lock-pins.sh missing or not executable"; exit 1; }
          ./scripts/check-lock-pins.sh
